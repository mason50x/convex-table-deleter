name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Extension: manifest parses, scripts pass `node --check` individually
      # and concatenated. Web: typecheck.
      - run: pnpm check

      - name: Build website
        run: pnpm build

      - name: Build extension store zip
        run: pnpm zip

      - uses: actions/upload-artifact@v4
        with:
          name: convex-table-deleter
          path: apps/extension/convex-table-deleter.zip

      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: apps/web/dist
